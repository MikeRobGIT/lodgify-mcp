# Lodgify MCP server (Streamable HTTP transport).
#
# Quickstart:
#   cp .env.example .env        # set LODGIFY_API_KEY and MCP_TOKEN
#   docker compose up -d
#   curl http://localhost:3076/health
#
# Variables (shell env or .env; .env is optional):
#   LODGIFY_API_KEY  required  Lodgify API key
#   MCP_TOKEN        required  bearer token clients must send
#   HOST_PORT        optional  published host port (default 3076)
#   BIND_ADDRESS     optional  host interface (default 127.0.0.1; use 0.0.0.0 to expose)
#   LOG_LEVEL        optional  default info
#
# Coolify / PaaS: use the Docker Compose build pack, set the domain on the
# `lodgify-mcp` service, and set the two required variables in the UI.

services:
  lodgify-mcp:
    build:
      context: .
      dockerfile: Dockerfile.http
      args:
        - PORT=3076

    env_file:
      - path: .env
        required: false

    environment:
      # Coolify reads this to route the generated domain to port 3076; ignored elsewhere.
      - SERVICE_FQDN_LODGIFY_MCP_3076
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3076
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LODGIFY_API_KEY=${LODGIFY_API_KEY:?LODGIFY_API_KEY is required}
      - MCP_TOKEN=${MCP_TOKEN:?MCP_TOKEN is required}

    # `expose` lets Coolify/other proxies route to the container; `ports` publishes it on the host
    # (change HOST_PORT if several stacks share a host).
    expose:
      - "3076"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3076}:3076"

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3076/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - mcp-network

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Development service with hot reload: docker compose --profile dev up
  lodgify-mcp-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        - PORT=${DOCKER_PORT:-3000}

    volumes:
      - ./src:/app/src:ro
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      # Prevent node_modules from being overwritten
      - /app/node_modules

    env_file:
      - path: .env
        required: false
      - path: .env.docker
        required: false

    environment:
      - NODE_ENV=development
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - PORT=${DOCKER_PORT:-3000}
      - DEBUG_HTTP=${DEBUG_HTTP:-1}

    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DOCKER_PORT:-3000}:${DOCKER_PORT:-3000}"

    command: ["bun", "run", "dev"]

    restart: always

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${DOCKER_PORT:-3000}/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - mcp-network

    profiles:
      - development
      - dev

networks:
  mcp-network:
    driver: bridge
